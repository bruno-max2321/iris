    verified: true
  - id: fade
    aliases:
    - fade to black
    - fade in
    - fade out
    - dip to white
    - flash frame
    - flash transition
    definition: The image fades to or from a solid colour (black by default; white is a 'dip to white' or flash).
    observable_cues:
    - Picture darkens or brightens to a flat colour, then the next shot appears
    measurement_hints:
    - frames.L_mean ramps toward 0 (or 100) with near-zero variance at the extreme
    counterexamples:
