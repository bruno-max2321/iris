  - id: dutch_angle
    aliases:
    - Dutch Angle
    - canted angle
    - dutch tilt
    definition: The camera is rolled so the horizon and verticals are deliberately tilted.
    observable_cues:
    - Horizon or verticals tilted by more than a few degrees
    measurement_hints:
    - '|frames.horizon_angle_deg| > ~5 degrees sustained across the shot (not a transient shake)'
    counterexamples:
    - confused_with: added_shake
      distinguish: Shake creates transient roll; dutch is a sustained tilt.
    - confused_with: low_angle
      distinguish: A low angle changes pitch; verticals converge but the horizon stays level.
    claim_kind_default: measured
