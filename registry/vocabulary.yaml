    definition: The scene slides vertically as if the camera rose or descended, but tilt, crane and crop cannot
      be separated.
    observable_cues:
    - Vertical global motion over a scene with little depth separation (e.g. top-down table shots)
    measurement_hints:
    - Dominant vertical flow with inconclusive motion.parallax_ratio; list tilt_*, crane_*, crop_animation as alternatives
    counterexamples:
    - confused_with: tilt_up
      distinguish: Promote to a tilt when the horizon or verticals show rotation without parallax.
    - confused_with: crane_up
      distinguish: Promote to a crane when parallax is measurable.
    claim_kind_default: estimated
    prompt_en: The view drifts slowly upward.
    sources:
    - url: https://higgsfield.ai/blog/ai-video-camera-control
      title: AI Video Camera Control
      accessed: '2026-11-01'
    verified: false
    verification_note: Iris analysis term by symmetry with apparent_lateral_travel; no Higgsfield source names it.
- id: camera.shot_size
  temporal_unit: shot
  cardinality: single
  description: Framing scale of the principal subject, measured from the subject or face bounding box relative to
    frame height. For a vertical 1080x1920 frame the thresholds below are starting values to calibrate in the pilot.
  region_scoped: false
  measurement_keys:
  - motion.subject_scale_ratio
  - motion.subject_track
  - sheets.keyframes
  terms:
  - id: wide_shot
    aliases:
