      title: W3C CSS Easing Functions Level 1 (CRD 2023-02-13)
      accessed: '2026-11-01'
    verified: true
  - id: spring_motion
    aliases:
    - spring
    - bounce
    - elastic
    - Elastic animation
    definition: 'Spring-like response: the element overshoots its target and oscillates with decaying amplitude
      before resting.'
    observable_cues:
    - Bouncy arrival with one or more oscillations
    measurement_hints:
    - Damped-oscillation fit beats bezier fits on residual; >= 1 sign change of velocity near the end
