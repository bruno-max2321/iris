- id: montage.transition
  temporal_unit: sequence
  cardinality: single
  description: How one shot passes to the next. Transitions are modelled as half-open intervals [start, end) that
    may overlap two shots; 1-3 frame events are kept as candidates. Temporal unit follows the shot/segment levels
    of film annotation ontologies such as AdA.
  region_scoped: false
  measurement_keys:
  - shots.boundaries
  - shots.transition_candidates
  - frames.diff_prev_ssim
  - frames.diff_prev_hist
  - frames.L_mean
  - motion.motion_blur_streak
  - shots.short_events
  qualifiers:
  - id: color
    values:
    - black
    - white
    - other
    description: Colour reached by a fade or dip.
    applies_to:
    - fade
  - id: direction
    values:
    - left
    - right
    - up
    - down
    - radial
    description: Direction of a wipe or whip.
    applies_to:
    - wipe
    - whip_transition
  terms:
  - id: hard_cut
    aliases:
    - cut
    - hard cut
    - clean cut
    - straight cut
    definition: An instantaneous change from one shot to the next with no intermediate frames.
    observable_cues:
    - Content changes completely between two consecutive frames
    measurement_hints:
    - Single-frame spike in frames.diff_prev_hist and 1-SSIM with no ramp; shots.boundaries marks one frame
    counterexamples:
    - confused_with: jump_cut
      distinguish: A jump cut keeps the same framing and subject, skipping time.
    - confused_with: cross_dissolve
      distinguish: A dissolve ramps over several frames.
    claim_kind_default: measured
    prompt_en: Hard cut to the next shot.
    dictionary_ids:
    - HF-0194
    sources:
    - url: https://higgsfield.ai/blog/seedance-2-5-prompting-guide
      title: Seedance 2.5 Prompting Guide
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/Kling-3.0-is-on-Higgsfield-User-Guide-AI-Video-Generation
      title: 'Higgsfield blog: Kling 4.0 and 3.0 Prompt Guide (re-read 2026-11-01)'
      accessed: '2026-11-01'
    - url: https://projectada.github.io/ontology/
      title: AdA Filmontology (annotation levels, types, values)
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/script-to-ai-storyboard-shot-list
      title: Script to Storyboard and Shot List
      accessed: '2026-11-01'
    verified: true
  - id: jump_cut
    aliases:
    - jump cut
    definition: A cut between two moments of the same shot or framing, producing a visible jump in time (typical
      of talking-head edits).
    observable_cues:
    - Same background and framing, subject position jumps
    measurement_hints:
    - Cut detected but background region pHash nearly identical across the boundary; subject mask displaced
    counterexamples:
    - confused_with: hard_cut
      distinguish: A hard cut changes the shot.
    - confused_with: punch_in
      distinguish: A punch-in also changes scale at the cut; record both if present.
    claim_kind_default: measured
    prompt_en: Jump cut within the same framing.
    sources:
    - url: https://projectada.github.io/ontology/
      title: AdA Filmontology (annotation levels, types, values)
      accessed: '2026-11-01'
    verified: false
    verification_note: Standard editing term; not found in the consulted Higgsfield guides.
  - id: match_cut
    aliases:
    - Match cut
    - match cut
    - graphic match
    definition: A cut that links two shots through similar shape, position, movement or action.
    observable_cues:
    - Matching silhouette, position or motion direction across the cut
    measurement_hints:
    - High shape/position similarity of salient masks across the boundary (IoU of subject masks) while content differs
    counterexamples:
    - confused_with: morph_transition
      distinguish: A morph interpolates frames between the shapes; a match cut is instantaneous.
    claim_kind_default: interpreted
    prompt_en: Match cut on the round shape of the plate.
    dictionary_ids:
    - HF-0195
    sources:
    - url: https://higgsfield.ai/blog/seedance-2-5-prompting-guide
      title: Seedance 2.5 Prompting Guide
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/Santiago-breakdown
      title: Direct an AI Short Film
      accessed: '2026-11-01'
    verified: true
  - id: cross_dissolve
    aliases:
    - dissolve
    - crossfade
    - mix
    definition: Two shots blend over several frames, one fading out as the other fades in.
    observable_cues:
    - Double exposure of both shots for several frames
    measurement_hints:
    - Monotonic ramp of frames.diff_prev_hist over 4-30 frames; pixel values are a linear mix of both shots
    counterexamples:
    - confused_with: fade
      distinguish: A fade passes through a solid colour.
    - confused_with: rack_focus
      distinguish: A rack focus keeps a single image.
    claim_kind_default: measured
    prompt_en: Slow cross dissolve between the shots.
    dictionary_ids:
    - HF-0208
    sources:
    - url: https://higgsfield.ai/blog/Kling-3.0-is-on-Higgsfield-User-Guide-AI-Video-Generation
      title: 'Higgsfield blog: Kling 4.0 and 3.0 Prompt Guide (re-read 2026-11-01)'
