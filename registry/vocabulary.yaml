- id: composition
  temporal_unit: frame
  cardinality: multi
  description: The 43 Iris visual techniques, classified by what the image does, not by what it shows. Ids are the
    original Iris ids. Evaluated on keyframes and contact sheets; most claims are interpreted and need a supporting
    sequence and a reviewer reason. An image usually shows one or two defining techniques plus supporting ones;
    untagged is a legitimate state. Where a cinematography term describes the same physical cue (rim_light, shallow_depth_of_field,
    silhouette_lighting), the Iris technique records the function and the other term records the measured appearance;
    they are linked with related_terms.
  region_scoped: false
  measurement_keys:
  - sheets.keyframes
  - color.region_palette
  - frames.edge_density
  - motion.subject_grid_position
  - motion.subject_scale_ratio
  terms:
  - id: chiaroscuro
    aliases: []
    definition: Strong light-dark modelling inside the form that gives volume.
    observable_cues:
    - Strong tonal gradient across the subject's surface; deep shadows inside the form
    measurement_hints:
    - High luma variance inside the subject mask with a continuous gradient (not a flat dark shape)
    counterexamples:
    - confused_with: silhouette
      distinguish: Silhouette suppresses internal detail; chiaroscuro models it.
    - confused_with: low_key
      distinguish: A black background alone is neither silhouette nor chiaroscuro.
    claim_kind_default: estimated
    iris_technique_id: chiaroscuro
    related_terms:
    - term_id: low_key
      relation: often_with
    - term_id: hard_light
      relation: often_with
    prompt_en: Dramatic chiaroscuro modelling the form in light and shadow.
    sources:
    - url: https://visuals.modernartdirection.com/
      title: Iris - A Taxonomy of Visuals (public site; technique IDs from marks.js, extracted in local iris-taxonomia.md)
      accessed: '2026-10-31'
    verified: true
    verification_note: Iris technique ID verified; meaning supported by a literal hint in the public Iris code (see
      iris-taxonomia.md section 3).
  - id: rimlight
    aliases: []
    definition: An edge of light that separates the subject from the ground, used to make it stand apart.
    observable_cues:
    - Bright contour around the subject against a darker ground
    measurement_hints:
    - High color.rim_edge_luma along the subject boundary
    counterexamples:
    - confused_with: silhouette
      distinguish: Silhouette darkens the subject interior; rim light only brightens the edge.
    claim_kind_default: interpreted
    iris_technique_id: rimlight
    related_terms:
    - term_id: rim_light
      relation: realized_by
    prompt_en: A bright rim separating the subject from the dark background.
    sources:
    - url: https://visuals.modernartdirection.com/
      title: Iris - A Taxonomy of Visuals (public site; technique IDs from marks.js, extracted in local iris-taxonomia.md)
      accessed: '2026-10-31'
    verified: false
    verification_note: Iris technique ID verified from the public marks.js; the Iris definition is gated, so this
      meaning is inferred from the ID and icon only.
  - id: complementary
    aliases: []
    definition: Two opposed hue families placed against each other to sharpen separation.
    observable_cues:
    - Two dominant hues roughly opposite on the colour wheel
    measurement_hints:
    - Bimodal hue histogram with peaks ~150-210 degrees apart
    counterexamples:
    - confused_with: warmcool
      distinguish: Warm/cool opposition can be non-complementary (orange vs blue-green is both; red vs blue is warm/cool
        but not complementary).
    claim_kind_default: estimated
    iris_technique_id: complementary
    prompt_en: Complementary colour contrast between subject and background.
    sources:
    - url: https://visuals.modernartdirection.com/
      title: Iris - A Taxonomy of Visuals (public site; technique IDs from marks.js, extracted in local iris-taxonomia.md)
      accessed: '2026-10-31'
    verified: true
    verification_note: Iris technique ID verified; meaning supported by a literal hint in the public Iris code (see
      iris-taxonomia.md section 3).
  - id: simultaneous
    aliases: []
    definition: A colour or grey looks different because of the colour that surrounds it (simultaneous contrast).
    observable_cues:
