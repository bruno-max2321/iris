- id: optics
  temporal_unit: shot
  cardinality: multi
  description: 'Lens and capture appearance: focus, depth of field, field of view, flare, halation, vignetting,
    motion blur, diffusion. These describe what the pixels look like, never the physical lens used: focal length,
    aperture and mm values are only allowed as claim_kind designed in direction.json.'
  region_scoped: false
  measurement_keys:
  - frames.sharpness_laplacian_var
  - frames.sharpness_map_grid
  - frames.edge_falloff_luma
  - frames.highlight_bloom
  - frames.line_curvature
  - motion.motion_blur_streak
  - motion.parallax_ratio
  - frames.clip_highlights
  terms:
  - id: shallow_depth_of_field
    aliases:
    - shallow DOF
    - f/1.4 Wide Open
    - thin focus
    - shallow focus
    - bokeh
    - oval bokeh
    definition: Only a thin depth slice is sharp; foreground and background fall into strong blur.
    observable_cues:
    - Subject edges crisp while background is soft or bokeh
    - Blur increases with distance from the focus plane
    measurement_hints:
    - 'High variance of frames.sharpness_map_grid: subject cells sharp, background cells < ~30% of subject sharpness'
    - Blur gradient correlates with estimated depth
    counterexamples:
    - confused_with: diffusion
      distinguish: Diffusion softens the whole frame (glow on highlights) regardless of depth.
    - confused_with: motion_blur
      distinguish: Motion blur is directional and follows movement, not depth.
    claim_kind_default: estimated
    related_terms:
    - term_id: dof
      relation: realizes
    prompt_en: Shallow depth of field, the subject tack sharp against a creamy blurred background.
    dictionary_ids:
    - HF-0100
    - HF-0098
    - HF-0105
    sources:
    - url: https://higgsfield.ai/blog/seedance-2-5-prompting-guide
      title: Seedance 2.5 Prompting Guide
