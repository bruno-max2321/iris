- id: narrative.hook_type
  temporal_unit: sequence
  cardinality: multi
  region_scoped: false
  description: How the opening seconds capture attention. Interpreted from the first shots, the first text cue and
    the transcript; always claim_kind interpreted and reviewer-accepted.
  measurement_keys:
  - shots.boundaries
  - text.tracks
  - audio.transcript_words
  - sheets.keyframes
  terms:
  - id: in_medias_res
    aliases: []
    definition: Opens inside the most intense moment, then rewinds to explain.
    observable_cues:
    - First shot is the climax action; later cue states a date or setup
    measurement_hints:
    - High motion energy in the first 2 s followed by a quiet card or title
    counterexamples:
    - confused_with: pattern_interrupt
      distinguish: In medias res is narrative order; pattern interrupt is a visual shock.
    claim_kind_default: interpreted
    dictionary_ids:
    - HF-0272
    sources: []
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
  - id: direct_question
    aliases: []
    definition: Opens with a question addressed to the viewer.
    observable_cues:
    - Question mark in the first text cue or rising intonation in the first sentence
    measurement_hints:
    - text.tracks first cue contains '?' or transcript first sentence is interrogative
    counterexamples:
    - confused_with: bold_claim
      distinguish: A claim asserts; a question asks.
    claim_kind_default: interpreted
    dictionary_ids:
    - HF-0272
    sources: []
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
  - id: bold_claim
    aliases: []
    definition: Opens with a strong assertion or a number.
    observable_cues:
    - Declarative first cue, often with a figure
    measurement_hints:
    - First cue is declarative and short (<= 8 words)
    counterexamples:
    - confused_with: direct_question
      distinguish: No question form.
    claim_kind_default: interpreted
    dictionary_ids:
    - HF-0272
    sources: []
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
  - id: pattern_interrupt
    aliases: []
    definition: Opens with a visual or sonic shock unrelated to the topic.
    observable_cues:
    - Abrupt cut, flash or loud sound in the first second
    measurement_hints:
    - Motion or audio energy peak at t < 1 s
    counterexamples:
    - confused_with: in_medias_res
      distinguish: Pattern interrupt is sensory, not narrative.
    claim_kind_default: interpreted
    dictionary_ids:
    - HF-0272
    sources: []
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
  - id: visual_curiosity
    aliases: []
    definition: Opens on an unexplained object or action that invites a question.
    observable_cues:
    - Close shot of something ambiguous; no text yet
    measurement_hints:
    - First text cue appears after t > 1.5 s
    counterexamples:
    - confused_with: pattern_interrupt
      distinguish: Curiosity is quiet; interrupt is loud.
    claim_kind_default: interpreted
    dictionary_ids:
    - HF-0272
    sources: []
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
