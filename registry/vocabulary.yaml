- id: camera.support
  temporal_unit: shot
  cardinality: single
  description: The rig or carrying method that the camera motion signature implies (or that a synthetic shot emulates).
    Inferred from motion texture (jitter spectrum, path smoothness), so the default claim is estimated.
  region_scoped: false
  measurement_keys:
  - motion.flow_jitter
  - motion.global_affine
  - motion.velocity_profile
  - motion.subject_track
  terms:
  - id: locked_off
    aliases:
    - locked off
    - tripod
    - sticks
    - locked-off tripod
    definition: 'The camera is fixed on a tripod or clamp: zero path motion and zero jitter.'
    observable_cues:
    - Rock-steady frame edges against background features
    measurement_hints:
    - motion.flow_jitter at noise floor and motion.global_affine ~0 over the whole shot
    counterexamples:
    - confused_with: steadicam
      distinguish: A stabilised rig still moves through space; locked-off does not move.
    - confused_with: handheld
      distinguish: Handheld held still still shows small low-frequency drift.
    claim_kind_default: measured
    related_terms:
    - term_id: static
      relation: produces
    prompt_en: Locked-off tripod shot.
    dictionary_ids:
    - HF-0070
    - HF-0072
    sources:
    - url: https://higgsfield.ai/blog/Kling-3.0-is-on-Higgsfield-User-Guide-AI-Video-Generation
      title: Kling 4.0 and 3.0 Prompt Guide
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/seedance-2-5-prompting-guide
      title: 'Higgsfield blog: Seedance 2.5 Prompting Guide (re-read 2026-11-01)'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/Santiago-breakdown
      title: Direct an AI Short Film
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/creator-hub/help-center/getting-started/how-do-i-write-a-good-prompt
      title: How to Write a Good AI Prompt
      accessed: '2026-11-01'
    verified: true
  - id: handheld
    aliases:
    - Handheld
    - shoulder-mounted
    - handheld drift
    - breathing sway
    - Wiggle
    definition: The camera is carried by hand or on the shoulder, producing irregular low-amplitude motion and micro-corrections.
    observable_cues:
    - Small irregular drift and bob; breathing sway
    - Framing corrections after subject movement
    measurement_hints:
    - Elevated motion.flow_jitter with energy around ~0.5-4 Hz; non-smooth motion.velocity_profile
    counterexamples:
    - confused_with: added_shake
      distinguish: Shake added in post is periodic or noise-like, identical across depth layers, and often shows
        crop margins scaling.
    - confused_with: steadicam
      distinguish: Steadicam paths are smooth with floating, low-jitter motion.
    claim_kind_default: estimated
    prompt_en: Handheld camera with subtle natural sway and micro-corrections.
    dictionary_ids:
    - HF-0069
    - HF-0073
    - HF-0079
    - HF-0080
    - HF-0437
    sources:
    - url: https://higgsfield.ai/blog/ai-video-camera-control
      title: AI Video Camera Control
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/motion/cf529456-6478-4622-a572-052f0d8ae378
      title: 'Motion preset: Handheld'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/Kling-3.0-is-on-Higgsfield-User-Guide-AI-Video-Generation
      title: 'Higgsfield blog: Kling 4.0 and 3.0 Prompt Guide (re-read 2026-11-01)'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/seedance-2-5-prompting-guide
      title: 'Higgsfield blog: Seedance 2.5 Prompting Guide (re-read 2026-11-01)'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/cinema-studio-4-0-complete-guide
      title: Cinema Studio 4.0 Complete Guide
      accessed: '2026-11-01'
    verified: true
  - id: steadicam
    aliases:
    - Steadicam
    - gimbal
    - gyro-rig
    - stabilised
    definition: 'A body-supported or gimbal-stabilised moving camera: travels through space with smooth, floating
      motion.'
    observable_cues:
    - Camera moves through the scene but frame stays smooth, without bumps
    measurement_hints:
    - Sustained translation with low motion.flow_jitter and smooth velocity changes
