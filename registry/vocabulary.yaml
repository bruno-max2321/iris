    definition: Two soft sources from roughly opposite sides crossing on the subject, giving modelling from both
      sides with soft shadows.
    observable_cues:
    - Two shadow directions, both soft
    - Highlights on both edges of the subject
    measurement_hints:
    - Two opposing luma gradients on the subject; wide color.shadow_edge_width
    counterexamples:
    - confused_with: rim_light
      distinguish: A rim lights only the edge from behind.
    - confused_with: flat_light
      distinguish: Flat light has no directional gradients at all.
    claim_kind_default: interpreted
    prompt_en: Soft cross lighting from two opposite sides.
