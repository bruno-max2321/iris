  description: Named lighting setups. Six names come verbatim from the Higgsfield Cinema Studio lighting presets
    (Soft cross, Contre jour, Overhead fall, Window, Practicals, Silhouette); the others are common light roles.
    A scheme is a pattern recognised from direction, quality and source cues together, so the default claim is interpreted.
  region_scoped: false
  measurement_keys:
  - color.light_face_luma_asymmetry
  - color.shadow_edge_width
