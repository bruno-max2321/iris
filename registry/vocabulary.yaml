dimensions:
- id: camera.movement
  temporal_unit: shot
  cardinality: multi
  description: Apparent or mechanical movement of the camera viewpoint during a shot (layer 1 of the four motion
    layers). Mechanism terms (dolly_*, zoom_*, crane_*, arc_*, pan_*, tilt_*) require evidence that separates translation
    from rotation from focal-length change; when the evidence cannot separate them, use the apparent_* terms and
    list the mechanisms as alternatives in the claim. Editorial transforms (digital zoom, crop animation, added
    shake) belong to edit.transform, subject motion to subject.action.
  region_scoped: false
  measurement_keys:
  - motion.flow_magnitude
  - motion.flow_direction
  - motion.flow_divergence
  - motion.flow_curl
  - motion.flow_jitter
  - motion.parallax_ratio
  - motion.global_affine
  - motion.subject_track
  - motion.subject_vs_background
  - motion.velocity_profile
  - motion.motion_blur_streak
  qualifiers:
  - id: speed
    values:
    - slow
    - medium
    - fast
    description: Perceived speed of the move, backed by motion.velocity_profile.
  terms:
  - id: static
    aliases:
    - locked-off
    - Static
    - fixed camera
    - tripod fixed
    definition: The viewpoint and framing stay fixed for the shot; only the subject or the light changes.
    observable_cues:
    - Background features keep the same pixel position across the shot
    - No global flow beyond noise level
    measurement_hints:
    - Global flow magnitude near zero after excluding subject regions; motion.global_affine translation, scale and
      rotation ~0
    - Low motion.flow_jitter (otherwise consider handheld)
    counterexamples:
    - confused_with: handheld
      distinguish: Handheld shows small irregular global motion (jitter) even when the operator tries to hold still.
    - confused_with: freeze_frame
      distinguish: A freeze also stops the subject; static keeps subject motion and sensor noise alive.
    claim_kind_default: measured
    related_terms:
    - term_id: locked_off
      relation: typically_realized_by
    prompt_en: The camera stays completely still, locked off on a tripod.
    dictionary_ids:
    - HF-0070
    - HF-0456
    sources:
    - url: https://higgsfield.ai/blog/ai-video-camera-control
      title: AI Video Camera Control
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/motion/c43e6d97-a55a-45d7-b5bc-b3a55d3a6e8e
      title: 'Motion preset: Static'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/Kling-3.0-is-on-Higgsfield-User-Guide-AI-Video-Generation
      title: 'Higgsfield blog: Kling 4.0 and 3.0 Prompt Guide (re-read 2026-11-01)'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/Santiago-breakdown
      title: Direct an AI Short Film
      accessed: '2026-11-01'
    verified: true
  - id: pan_left
    aliases:
    - Pan Left
    - pan left
    definition: The camera rotates horizontally toward screen-left around its own position.
    observable_cues:
    - The whole scene slides toward screen-right at roughly uniform speed regardless of depth
    - Vertical lines stay vertical; no change in relative overlap between near and far objects
    measurement_hints:
    - Global horizontal flow pointing right (+x) with low motion.parallax_ratio (near and far layers move together)
    - motion.global_affine dominated by +tx; divergence ~0
    counterexamples:
    - confused_with: dolly_left
      distinguish: 'A lateral dolly (truck) produces depth-dependent parallax: near objects move faster than far
        ones.'
    - confused_with: crop_animation
      distinguish: A crop animation over a still frame has zero parallax and no perspective or motion-blur change;
        check for upscale softness.
    claim_kind_default: estimated
    prompt_en: The camera pans slowly to the left from a fixed position.
    dictionary_ids:
    - HF-0064
    - HF-0449
    sources:
    - url: https://higgsfield.ai/blog/ai-video-camera-control
      title: AI Video Camera Control
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/motion/6f087874-24f3-4d48-9eb9-f4349ac6a105
      title: 'Motion preset: Pan Left'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/how-to-make-ai-video-look-filmed
      title: Make AI Video Look Filmed
      accessed: '2026-11-01'
    verified: true
  - id: pan_right
    aliases:
    - Pan Right
    - pan right
    definition: The camera rotates horizontally toward screen-right around its own position.
    observable_cues:
    - The whole scene slides toward screen-left at roughly uniform speed regardless of depth
    measurement_hints:
    - Global horizontal flow pointing left (-x) with low motion.parallax_ratio
    - motion.global_affine dominated by -tx; divergence ~0
    counterexamples:
    - confused_with: dolly_right
      distinguish: A lateral dolly shows depth-dependent parallax; a pan does not.
    - confused_with: crop_animation
      distinguish: A crop animation over a still frame has zero parallax and no perspective change.
    claim_kind_default: estimated
    prompt_en: The camera pans slowly to the right from a fixed position.
    dictionary_ids:
    - HF-0064
    - HF-0450
    sources:
    - url: https://higgsfield.ai/blog/ai-video-camera-control
      title: AI Video Camera Control
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/motion/ce0b3d96-be4c-4b2d-962a-340dd386d910
      title: 'Motion preset: Pan Right'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/how-to-make-ai-video-look-filmed
      title: Make AI Video Look Filmed
      accessed: '2026-11-01'
    verified: true
  - id: tilt_up
    aliases:
    - Tilt up
    - tilt up
    definition: The camera rotates vertically upward around its own position.
    observable_cues:
    - The scene slides downward in frame; the horizon moves down
    - Vertical lines may converge slightly more toward the top
    measurement_hints:
    - Global vertical flow pointing down (+y) with low motion.parallax_ratio
    counterexamples:
    - confused_with: crane_up
      distinguish: 'A crane rise translates the camera: foreground and background shift by different amounts (parallax).'
    - confused_with: crop_animation
      distinguish: A vertical crop animation over a still frame keeps perspective constant.
    claim_kind_default: estimated
    prompt_en: The camera tilts up slowly from a fixed position.
    dictionary_ids:
    - HF-0065
    - HF-0462
    sources:
    - url: https://higgsfield.ai/blog/ai-video-camera-control
      title: AI Video Camera Control
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/motion/9f127dad-0db0-4e3d-a440-3cfbffca30b6
      title: 'Motion preset: Tilt up'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/how-to-make-ai-video-look-filmed
      title: 'Higgsfield blog: How to Make AI Video Look Filmed (re-read 2026-11-01)'
      accessed: '2026-11-01'
    verified: true
  - id: tilt_down
    aliases:
    - Tilt Down
    - tilt down
    definition: The camera rotates vertically downward around its own position.
    observable_cues:
    - The scene slides upward in frame; the horizon moves up
    measurement_hints:
    - Global vertical flow pointing up (-y) with low motion.parallax_ratio
    counterexamples:
    - confused_with: crane_down
      distinguish: A crane descent translates the camera and produces parallax between depth layers.
    - confused_with: crop_animation
      distinguish: A vertical crop animation keeps perspective constant and shows no motion blur.
    claim_kind_default: estimated
    prompt_en: The camera tilts down slowly from a fixed position.
    dictionary_ids:
    - HF-0065
    - HF-0461
    sources:
    - url: https://higgsfield.ai/blog/ai-video-camera-control
      title: AI Video Camera Control
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/motion/1958a932-8ffb-4f1a-a5cd-480858f6ae84
      title: 'Motion preset: Tilt Down'
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/how-to-make-ai-video-look-filmed
      title: 'Higgsfield blog: How to Make AI Video Look Filmed (re-read 2026-11-01)'
      accessed: '2026-11-01'
    verified: true
  - id: dolly_in
    aliases:
    - Dolly In
    - dolly-in
    - push in on dolly
    - dolly push
    definition: The camera physically travels toward the subject, so perspective changes as it approaches.
    observable_cues:
    - Foreground objects grow faster than the background (depth-dependent magnification)
    - 'Occlusion relationships change: background reveals or hides behind foreground edges'
    measurement_hints:
    - Sustained positive motion.flow_divergence centred on the subject PLUS motion.parallax_ratio clearly above
      zero between depth layers
    - Background scale rate lower than foreground scale rate
    counterexamples:
    - confused_with: zoom_in
      distinguish: 'A zoom magnifies all depths equally from a fixed viewpoint: no parallax, occlusions stay the
        same.'
    - confused_with: apparent_push_in
      distinguish: Use apparent_push_in when depth separation is too weak to measure parallax.
    - confused_with: digital_zoom
      distinguish: A digital zoom also lacks parallax and usually softens detail as it scales.
    claim_kind_default: estimated
    prompt_en: The camera dollies in slowly toward the subject on a smooth track.
    dictionary_ids:
    - HF-0060
    - HF-0423
    sources:
    - url: https://higgsfield.ai/blog/ai-video-camera-control
      title: AI Video Camera Control
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/motion/1438937c-a220-4859-93f4-f373da3f73fb
      title: 'Motion preset: Dolly In'
      accessed: '2026-11-01'
    - url: https://github.com/higgsfield-ai/skills/blob/main/higgsfield-generate/references/prompt-engineering.md
      title: Prompt Engineering — Official Higgsfield Skill
      accessed: '2026-11-01'
    verified: true
  - id: dolly_out
    aliases:
    - Dolly Out
    - pull-back on dolly
    - dolly back
    definition: The camera physically travels away from the subject, so perspective changes as it retreats.
    observable_cues:
    - Foreground shrinks faster than the background; more of the environment is revealed with changing overlap
    measurement_hints:
    - Sustained negative motion.flow_divergence plus measurable motion.parallax_ratio between depth layers
    counterexamples:
    - confused_with: zoom_out
      distinguish: A zoom-out widens all depths equally without parallax.
    - confused_with: apparent_pull_out
      distinguish: Use apparent_pull_out when parallax cannot be measured.
