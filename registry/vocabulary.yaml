    verification_note: A macro look is not proof of a macro lens.
- id: camera.angle
  temporal_unit: shot
  cardinality: multi
  description: Vertical viewpoint and roll of the camera relative to the subject, plus viewpoint conventions (POV,
    over-the-shoulder). One vertical angle (eye_level, low_angle, high_angle, top_down) applies at a time; dutch_angle,
    pov and over_the_shoulder may co-occur.
  region_scoped: false
  measurement_keys:
  - frames.horizon_angle_deg
  - motion.subject_track
  - sheets.keyframes
  exclusive_groups:
  - - eye_level
    - low_angle
    - high_angle
    - top_down
  terms:
  - id: eye_level
    aliases:
    - eye-level
    - straight-on
    definition: The camera sits near the subject's eye height (or table height for food), looking straight on.
    observable_cues:
    - Horizon passes near the subject's eyes
    - Vertical lines stay parallel
    measurement_hints:
    - Vanishing point near subject eye line; little vertical convergence
    counterexamples:
    - confused_with: high_angle
      distinguish: A high angle shows the top surfaces of objects (tabletop visible).
    claim_kind_default: estimated
    prompt_en: Eye-level camera, straight on.
