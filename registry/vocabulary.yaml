    counterexamples:
    - confused_with: motion_graphics
      distinguish: Motion graphics are designed, not captured UI.
    claim_kind_default: estimated
    sources: []
    verified: false
    verification_note: Iris extension; no Higgsfield term.
- id: light.side
  temporal_unit: shot
  cardinality: single
  region_scoped: false
  description: 'Lateral side of the key light relative to camera (screen-left, screen-right, centred). Complements
    light.direction, which records front/side/top/back. Needed for continuity rules: a style can require the key
    to stay on one side across all shots.'
  measurement_keys:
  - light.face_luma_asymmetry
  - light.shadow_gradient_direction
  - color.region_L_percentiles
  terms:
  - id: key_screen_left
    aliases:
    - key from camera-left
    - light from the left
    definition: The brighter side of the subject is screen-left; shadows fall screen-right.
    observable_cues:
    - Face or object brighter on the left half; cast shadows extend to the right
    measurement_hints:
    - light.face_luma_asymmetry left-right > +0.08, or shadow gradient direction pointing right
    counterexamples:
    - confused_with: key_screen_right
      distinguish: Sign of the asymmetry is reversed.
    claim_kind_default: estimated
    prompt_en: Soft key light from camera-left.
    dictionary_ids:
    - HF-0048
    - HF-0142
    sources: &id001
    - url: https://higgsfield.ai/blog/ai-video-prompt-mistakes
      title: AI Video Prompt Mistakes
      accessed: '2026-11-01'
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
  - id: key_screen_right
    aliases:
    - key from camera-right
    definition: The brighter side of the subject is screen-right; shadows fall screen-left.
    observable_cues:
    - Face or object brighter on the right half; cast shadows extend to the left
    measurement_hints:
    - light.face_luma_asymmetry left-right < -0.08
    counterexamples:
    - confused_with: key_screen_left
      distinguish: Sign of the asymmetry is reversed.
    claim_kind_default: estimated
    prompt_en: Soft key light from camera-right.
    dictionary_ids:
    - HF-0048
    - HF-0142
    sources: *id001
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
  - id: key_centred
    aliases:
    - frontal key
    - on-axis key
    definition: 'No measurable lateral bias: light arrives from the camera axis or from directly above.'
    observable_cues:
    - Symmetric shading on the face; shadows fall behind or straight down
    measurement_hints:
    - '|light.face_luma_asymmetry| <= 0.08'
    counterexamples:
    - confused_with: flat_light
      distinguish: Centred key can still be hard and directional; flat light has no modelling at all.
    claim_kind_default: estimated
    prompt_en: Frontal key light on the camera axis.
    dictionary_ids:
    - HF-0142
    sources: *id001
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
  - id: key_side_unclear
    aliases: []
    definition: Laterality cannot be determined (no face, no cast shadows, multiple sources).
    observable_cues:
    - Multiple competing sources; backlit silhouette; flat graphics
    measurement_hints:
    - Asymmetry metrics unavailable or contradictory across the shot
    counterexamples:
    - confused_with: key_centred
      distinguish: Centred is a positive finding; unclear is an abstention.
    claim_kind_default: estimated
    sources: []
    verified: false
    verification_note: Iris extension added 2026-11-01 for the Style Bible contract.
