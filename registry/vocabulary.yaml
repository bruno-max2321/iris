    definition: Progress starts fast and decelerates into the final position; the usual choice for entrances.
    observable_cues:
    - Element arrives quickly and settles gently
    measurement_hints:
    - Best fit near cubic-bezier(0,0,0.58,1); velocity peaks at the start
    counterexamples:
    - confused_with: ease_in
      distinguish: Ease-in accelerates instead.
    - confused_with: spring_motion
      distinguish: A spring overshoots and oscillates.
    claim_kind_default: estimated
    dictionary_ids:
    - IR-0004
    sources:
    - url: https://www.w3.org/TR/css-easing-1/
      title: W3C CSS Easing Functions Level 1 (CRD 2023-02-13)
      accessed: '2026-11-01'
    - url: https://www.adobe.com/learn/after-effects/web/create-fluid-text-animations
      title: 'Adobe: Create fluid text animations (cited as A01 in the local EffectCraft guide; not re-opened)'
      accessed: '2026-10-30'
    verified: true
    verification_note: 'In After Effects/EffectCraft naming, the deceleration into a key is ''easyEaseIn'' on that
      key: names are inverted relative to CSS.'
  - id: ease_in_out
    aliases:
    - ease-in-out
    - easy ease
    - easyEase
    definition: 'Progress accelerates then decelerates: slow start, fast middle, slow end.'
    observable_cues:
    - Smooth departure and arrival
    measurement_hints:
    - Best fit near cubic-bezier(0.42,0,0.58,1); symmetric bell-shaped velocity
    counterexamples:
    - confused_with: linear_easing
      distinguish: Linear has a flat velocity profile.
    claim_kind_default: estimated
    dictionary_ids:
    - IR-0005
    sources:
