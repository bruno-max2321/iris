# Iris creative vocabulary - the single term registry.
# Language: English. Validate with: python3 tools/validate_vocabulary.py
# Bindings to generation/editing targets live in bindings/; Higgsfield dictionary in dictionaries/.
version: 1.0.0
generated_at: '2026-11-01'
language: en
name: Iris creative description vocabulary
id_policy: Term ids are globally unique snake_case English. Camera, light and optics ids follow the spelling used
  in official Higgsfield guides; composition ids are the original Iris technique ids. Claims may reference a term
  as '<term_id>' or the qualified '<dimension_id>=<term_id>'. Opaque Higgsfield preset names never become term ids;
  they live only in bindings/.
claim_kinds:
  measured: Method, units, frame ids, transform and numeric result recorded.
  estimated: Temporal evidence, method, alternatives and uncertainty recorded.
  interpreted: Supporting sequence and reviewer reason recorded.
  designed: Creative target in direction.json only (never in analysis.json).
temporal_units:
  frame: One presented frame (keyframe for composition).
  shot: A half-open frame interval between two shot boundaries.
  sequence: Two or more consecutive shots, or a boundary region spanning them (transitions, caption runs).
  video: The whole asset or a long segment of it.
regions:
  background: Background and set surfaces.
  food: Food and drink.
  product: Products, packaging, devices as objects.
  skin: Human skin (face, hands).
  ui: Real app UI shown on screen.
  graphics: Overlaid graphics and typography.
  whole_frame: The whole frame, only when a region split is not meaningful.
iris_techniques:
- chiaroscuro
- rimlight
- complementary
- simultaneous
- warmcool
- satblock
- silhouette
