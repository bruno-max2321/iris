- id: light.key
  temporal_unit: shot
  cardinality: single
  description: 'Tonal key: the overall distribution of tones in the lit scene (bright, middle or dark), measured
    on L* histograms per region.'
  region_scoped: false
  measurement_keys:
  - frames.L_mean
  - frames.L_hist16
  - color.region_L_percentiles
  - frames.clip_highlights
  - frames.clip_shadows
  terms:
  - id: high_key
    aliases:
    - high-key
    - bright and airy
    definition: Predominantly bright tones with light shadows and restrained contrast; not careless overexposure.
    observable_cues:
    - Mostly white or pastel surfaces; shadows light grey
    measurement_hints:
    - L* median > ~65 and p10 > ~35 in the main regions without large clipped areas
    counterexamples:
    - distinguish: Overexposure loses detail in clipped regions (frames.clip_highlights high); high key keeps highlight
        detail.
    claim_kind_default: measured
    prompt_en: High-key lighting, bright and airy.
    dictionary_ids:
    - TX-0015
    sources:
    - url: https://www.fujifilm-x.com/en-gb/learning-centre/mastering-high-key-and-low-key-photography/
      title: 'Fujifilm: High-Key and Low-Key Photography'
      accessed: '2026-11-01'
    verified: false
    verification_note: Only a manufacturer photography source (Fujifilm) was found; no official Higgsfield guide
      uses 'high-key' (searched 2026-11-01).
  - id: mid_key
    aliases:
    - normal key
    - neutral exposure
    definition: A balanced tonal distribution centred on middle grey with both highlights and shadows present.
    observable_cues:
    - Normal exposure; full but not extreme range
    measurement_hints:
    - L* median ~35-65 with balanced histogram tails
    counterexamples:
    - confused_with: high_key
      distinguish: High key shifts the whole histogram up.
    - confused_with: low_key
      distinguish: Low key shifts it down.
    claim_kind_default: measured
    prompt_en: Balanced, naturally exposed lighting.
    dictionary_ids:
    - HF-0162
    sources:
    - url: https://higgsfield.ai/blog/seedance-2-5-prompting-guide
      title: Seedance 2.5 Prompting Guide
      accessed: '2026-11-01'
    - url: https://higgsfield.ai/blog/Santiago-breakdown
      title: Direct an AI Short Film
      accessed: '2026-11-01'
    verified: false
    verification_note: Iris completion of the high/low key pair; 'neutral exposure' is the closest documented term.
  - id: low_key
    aliases:
    - low-key
    definition: Predominantly dark tones with selected illuminated details; not merely underexposure.
    observable_cues:
    - Large dark areas with pools of light on the subject
    measurement_hints:
    - L* median < ~35 with a bright subject region well above the scene median
    counterexamples:
    - confused_with: crushed_blacks
      distinguish: Crushed blacks is a grading defect or style of lost shadow detail, possible in any key.
    - confused_with: silhouette_lighting
