    counterexamples:
    - confused_with: flat_light
      distinguish: Soft light still models form with a gradient; flat light has almost no gradient.
    - confused_with: low_contrast
      distinguish: Edge softness is independent of the lit/shadow ratio.
    claim_kind_default: estimated
