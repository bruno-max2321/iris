  terms:
  - id: linear_easing
    aliases:
    - linear
    - IR-0002 Linear easing
    definition: Progress changes at a constant rate from start to end.
    observable_cues:
    - Element moves at constant speed and stops abruptly
    measurement_hints:
    - Best fit is cubic-bezier(0,0,1,1) with the lowest residual; flat velocity profile
    counterexamples:
