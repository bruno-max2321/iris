  - id: top_down
    aliases:
    - overhead
    - flat lay
    - Overhead
    - 90-degree overhead
    definition: The camera points straight down at the scene (flat lay), so circular plates appear as circles.
    observable_cues:
    - Plates and bowls look perfectly round
    - No horizon; table surface fills the frame
    measurement_hints:
    - Ellipse ratio of circular objects > ~0.9; no vanishing point
    counterexamples:
    - confused_with: high_angle
