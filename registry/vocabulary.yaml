- id: graphic.motion
  temporal_unit: shot
  cardinality: multi
  description: Timing and easing of graphic elements (captions, shapes, masks, UI overlays; layer 4 of the motion
    model). Easing families are fitted to element trajectories with a residual error; the source project's keyframes
    are never claimed. Exactly one easing family per tracked move.
  region_scoped: false
  measurement_keys:
