# Binding table: vocabulary term -> ffmpeg
# relation: exact | approx | prompt_only | unsupported. A term absent from this file is unsupported here.
target: ffmpeg
surface: ffmpeg_filtergraph
capabilities: capabilities/ffmpeg-8.1-filters.json
generated_at: '2026-11-01'
notes: Filter names and xfade transitions were checked against the local ffmpeg 8.1 build; re-run tools/validate_vocabulary.py
  with a capabilities file captured on the Grok Bot VM. Numeric values are starting points. Measurement filters
  (ebur128, silencedetect) belong to the analysis pipeline, not to bindings. drawtext and subtitles are absent from
  the authoring build (no libfreetype/libass); rows using them declare build_requires and the validator reports
  them as warnings until the VM capture includes them.
rows:
- term_id: digital_zoom
  target:
    filter: zoompan=z='min(zoom+0.0015,1.3)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30
    filters_used:
    - zoompan
  relation: exact
  notes: Progressive post zoom; upsample first to limit softening.
  verified_on: '2026-11-01'
- term_id: punch_in
  target:
    filter: crop=iw/1.15:ih/1.15,scale=1080:1920
    filters_used:
    - crop
    - scale
  relation: exact
  notes: Apply to the segment after the cut.
  verified_on: '2026-11-01'
- term_id: crop_animation
  target:
    filter: crop=w=iw*0.8:h=ih*0.8:x='(iw-ow)*t/3':y='(ih-oh)/2',scale=1080:1920
    filters_used:
    - crop
    - scale
  relation: exact
  notes: Linear scan over 3 s.
  verified_on: '2026-11-01'
- term_id: added_shake
  target:
    filter: crop=w=iw-40:h=ih-40:x='20+12*sin(t*37)':y='20+12*cos(t*29)',scale=1080:1920
    filters_used:
    - crop
    - scale
  relation: approx
  notes: Pseudo-random shake with overscan.
  verified_on: '2026-11-01'
- term_id: freeze_frame
  target:
    filter: tpad=stop_mode=clone:stop_duration=1
    filters_used:
    - tpad
  relation: exact
  notes: Freezes the last frame; for mid-shot freezes split with trim and concat.
  verified_on: '2026-11-01'
- term_id: slow_motion
  target:
    filter: setpts=2.0*PTS,minterpolate=fps=30:mi_mode=mci
    filters_used:
    - setpts
    - minterpolate
  relation: exact
  notes: Motion interpolation may create artefacts; check defects.
  verified_on: '2026-11-01'
- term_id: fast_motion
  target:
    filter: setpts=0.5*PTS
    filters_used:
    - setpts
  relation: exact
  notes: Retime audio separately with atempo.
  verified_on: '2026-11-01'
- term_id: speed_ramp
  target:
    filter: setpts='if(lt(T,1),PTS,1+(PTS-1/TB)*2)'
    filters_used:
    - setpts
  relation: approx
  notes: Piecewise expression; validate timestamps after the ramp.
  verified_on: '2026-11-01'
- term_id: timelapse
  target:
    filter: setpts=PTS/10
    filters_used:
    - setpts
  relation: approx
  notes: Drop audio or replace with music.
  verified_on: '2026-11-01'
- term_id: reverse_playback
  target:
    filter: reverse
    filters_used:
    - reverse
  relation: exact
  notes: 'Buffers the whole clip in memory: trim first.'
  verified_on: '2026-11-01'
- term_id: hard_cut
  target:
    filter: concat=n=2:v=1:a=1
    filters_used:
    - concat
  relation: exact
  notes: ''
  verified_on: '2026-11-01'
- term_id: jump_cut
  target:
    filter: trim=start=0:end=2,setpts=PTS-STARTPTS
    filters_used:
    - trim
    - setpts
  relation: approx
  notes: Trim and concat segments of the same take.
  verified_on: '2026-11-01'
- term_id: cross_dissolve
  target:
    filter: xfade=transition=fade:duration=0.5:offset=2.5
    filters_used:
    - xfade
  relation: exact
  notes: xfade 'fade' is a crossfade; 'dissolve' is a pixel-noise dissolve.
  verified_on: '2026-11-01'
- term_id: fade
  target:
    filter: xfade=transition=fadeblack:duration=0.5:offset=2.5
    filters_used:
    - xfade
  relation: exact
  when:
    color: black
  notes: Through black.
  verified_on: '2026-11-01'
- term_id: fade
  target:
    filter: xfade=transition=fadewhite:duration=0.3:offset=2.5
    filters_used:
    - xfade
  relation: exact
  when:
    color: white
  notes: Dip to white / flash.
  verified_on: '2026-11-01'
- term_id: wipe
  target:
    filter: xfade=transition=wipeleft:duration=0.4:offset=2.5
    filters_used:
    - xfade
  relation: exact
  when:
    direction: left
  notes: wiperight, wipeup, wipedown for other directions.
  verified_on: '2026-11-01'
- term_id: whip_transition
  target:
    filter: xfade=transition=hblur:duration=0.25:offset=2.5
    filters_used:
    - xfade
  relation: approx
  notes: Horizontal blur transition approximates a whip.
  verified_on: '2026-11-01'
- term_id: mask_transition
  target:
    filter: xfade=transition=circleopen:duration=0.4:offset=2.5
    filters_used:
    - xfade
  relation: approx
  notes: Graphic stand-in; a true object mask needs a matte and overlay.
  verified_on: '2026-11-01'
- term_id: black_and_white
